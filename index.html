<!doctype html>
<html lang="et">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Börsitark – investeerimine selges eesti keeles</title>
<meta name="description" content="Õpi investeerimise põhitõed 10 lühikese sammuga eesti keeles. Sõnastik, kalkulaator, tasude võrdlus ja harjutusportfell.">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600&amp;family=Space+Grotesk:wght@500;600;700&amp;display=swap">
<style>
body{margin:0;background:#F6F7F4}
a{color:#0E6B4F}a:hover{color:#08523C}
button{font-family:inherit;cursor:pointer}
input,textarea{font-family:inherit}
</style>
<style>
*,*::before,*::after{box-sizing:border-box}
input,textarea,select{max-width:100%}
h1,h2{overflow-wrap:anywhere}
@media (max-width:640px){
  main{padding:20px 14px 48px !important}
  main section,main article,main aside>div,main aside>form{padding:20px !important}
  main h1{font-size:30px !important;line-height:1.15 !important}
  header nav button{padding:0 10px !important;font-size:15px !important}
}
@media print{header,footer,.no-print{display:none !important}body,main{background:#fff !important}main{padding:0 !important}#plan-print{border:0 !important}}
</style>
</head>
<body>
<div id="app"></div>
<template id="tpl">
<div style="min-height: 100vh; background: #F6F7F4; color: #14201B; font-family: Inter, system-ui, sans-serif; font-size: 16px; line-height: 1.55">

<header style="background: #FFFFFF; border-bottom: 1px solid #E2E6E1">
<div style="max-width: 1120px; margin: 0 auto; padding: 14px 24px; display: flex; flex-wrap: wrap; align-items: center; justify-content: space-between; gap: 12px">
<button onClick="{{ goHome }}" style="display: flex; align-items: center; gap: 10px; background: none; border: 0; padding: 6px 0; min-height: 44px">
<svg width="28" height="28" viewBox="0 0 28 28" aria-hidden="true"><rect width="28" height="28" rx="7" fill="{{ accent }}"></rect><path d="M6 19l5-5 4 3 7-8" stroke="#FFFFFF" stroke-width="2.4" fill="none" stroke-linecap="round" stroke-linejoin="round"></path></svg>
<span style="font-family: 'Space Grotesk', sans-serif; font-weight: 700; font-size: 21px; color: #14201B">Börsitark</span>
</button>
<nav aria-label="Peamenüü" style="display: flex; flex-wrap: wrap; gap: 4px">
<sc-for list="{{ nav }}" as="n" hint-placeholder-count="6">
<button onClick="{{ n.pick }}" style="{{ n.style }}">{{ n.label }}</button>
</sc-for>
</nav>
</div>
</header>

<main style="max-width: 1120px; margin: 0 auto; padding: 32px 24px 64px">

<sc-if value="{{ isHome }}" hint-placeholder-val="{{ true }}">
<section style="background: #FFFFFF; border: 1px solid #E2E6E1; border-radius: 20px; padding: 44px 40px; display: flex; flex-direction: column; gap: 16px">
<h1 style="margin: 0; font-family: 'Space Grotesk', sans-serif; font-size: 44px; line-height: 1.1; max-width: 760px">Investeerimine selges eesti keeles</h1>
<p style="margin: 0; font-size: 19px; color: #4B5A53; max-width: 640px">Õpi rahulikus tempos ja küsi teistelt, kes on sama tee juba käinud.</p>
<div style="display: grid; grid-template-columns: repeat(auto-fit, minmax(260px, 1fr)); gap: 14px; margin-top: 8px">
<button onClick="{{ startPath }}" style="text-align: left; border: 0; border-radius: 16px; padding: 24px; background: {{ accent }}; color: #FFFFFF; display: flex; flex-direction: column; gap: 8px; min-height: 150px">
<span style="font-family: 'Space Grotesk', sans-serif; font-size: 24px; font-weight: 700">{{ doorTitle }}</span>
<span style="font-size: 16px; color: #DDEFE7">{{ doorText }}</span>
<span style="font-size: 14px; color: #DDEFE7; font-weight: 600">{{ progressLabel }}</span>
</button>
<button onClick="{{ goInvest }}" style="text-align: left; border: 1.5px solid #14201B; border-radius: 16px; padding: 24px; background: #FFFFFF; color: #14201B; display: flex; flex-direction: column; gap: 8px; min-height: 150px">
<span style="font-family: 'Space Grotesk', sans-serif; font-size: 24px; font-weight: 700">Investeerin juba →</span>
<span style="font-size: 16px; color: #4B5A53">Turuhinnad, süvateemad, maksud ja arutelud teiste investoritega.</span>
</button>
</div>
</section>

<section style="margin-top: 24px; background: #FFFFFF; border: 2px solid #0E6B4F; border-radius: 20px; padding: 28px 32px; display: flex; flex-direction: column; gap: 14px">
<p style="margin: 0; font-size: 13px; font-weight: 700; color: #0B4D39; text-transform: uppercase; letter-spacing: 0.04em">Nädala küsimus</p>
<h2 style="margin: 0; font-family: 'Space Grotesk', sans-serif; font-size: 28px; line-height: 1.2">{{ weekly.q }}</h2>
<p style="margin: 0; font-size: 17px; color: #22302A; max-width: 760px">{{ weekly.short }}</p>
<div style="display: flex; flex-wrap: wrap; gap: 16px; align-items: flex-end">
<div style="flex: 1 1 260px">
<label for="wqa" style="display: flex; justify-content: space-between; font-size: 15px; font-weight: 600"><span>Investeerin kuus</span><span>{{ fq.amtLabel }}</span></label>
<input id="wqa" type="range" min="25" max="1000" step="25" value="{{ fq.amt }}" onChange="{{ fqSetAmt }}" style="width: 100%; accent-color: #0E6B4F; min-height: 32px">
</div>
<div role="group" aria-label="Kus investeerid" style="display: flex; flex-wrap: wrap; gap: 6px">
<sc-for list="{{ fq.platOpts }}" as="o" hint-placeholder-count="4">
<button onClick="{{ o.pick }}" style="{{ o.style }}">{{ o.label }}</button>
</sc-for>
</div>
</div>
<div style="display: grid; grid-template-columns: repeat(auto-fit, minmax(200px, 1fr)); gap: 10px">
<sc-for list="{{ fq.rows }}" as="r" hint-placeholder-count="3">
<div style="{{ r.cardStyle }}">
<span style="font-size: 15px; font-weight: 600">{{ r.label }}</span>
<span style="font-family: 'Space Grotesk', sans-serif; font-size: 24px; font-weight: 700">{{ r.cost }}</span>
<span style="font-size: 13px; color: #4B5A53">ostutasud aastas · {{ r.pct }} rahast</span>
</div>
</sc-for>
</div>
<div style="display: flex; flex-wrap: wrap; gap: 10px; align-items: center">
<button onClick="{{ weekly.open }}" style="min-height: 48px; padding: 0 20px; border: 0; border-radius: 12px; background: {{ accent }}; color: #FFFFFF; font-size: 16px; font-weight: 600">Loe, miks see nii on →</button>
<button onClick="{{ goFees }}" style="min-height: 48px; padding: 0 18px; border: 1px solid #C9D1CB; border-radius: 12px; background: #FFFFFF; color: #14201B; font-size: 15px">Kõik tasud võrdluses</button>
</div>
</section>

<section style="margin-top: 32px">
<div style="display: flex; justify-content: space-between; align-items: baseline; gap: 10px; margin-bottom: 12px">
<h2 style="margin: 0; font-family: 'Space Grotesk', sans-serif; font-size: 24px">Rahaküsimused</h2>
<button onClick="{{ goMoney }}" style="background: none; border: 0; padding: 0; min-height: 40px; color: #0B5C43; font-size: 15px; font-weight: 600">Kõik küsimused →</button>
</div>
<div style="display: grid; grid-template-columns: repeat(auto-fit, minmax(240px, 1fr)); gap: 10px">
<sc-for list="{{ mqHome }}" as="m" hint-placeholder-count="4">
<button onClick="{{ m.pick }}" style="text-align: left; padding: 16px 18px; border: 1px solid #E2E6E1; border-radius: 12px; background: #FFFFFF; color: #14201B; display: flex; flex-direction: column; gap: 6px">
<span style="font-size: 16px; font-weight: 600">{{ m.q }}</span>
<span style="font-size: 13px; color: #0B5C43; font-weight: 600">Arvuta enda jaoks →</span>
</button>
</sc-for>
</div>
</section>

<div style="margin-top: 28px; display: flex; flex-wrap: wrap; gap: 10px">
<label for="homeq" style="position: absolute; left: -9999px">Otsi teemadest, sõnastikust ja aruteludest</label>
<input id="homeq" value="{{ homeQ }}" onChange="{{ setHomeQ }}" onKeyDown="{{ homeKey }}" placeholder="Otsi või küsi, nt dividend, II sammas, ETF" style="flex: 1 1 260px; min-height: 52px; padding: 0 18px; font-size: 17px; border: 1.5px solid #C9D1CB; border-radius: 12px; background: #FFFFFF; color: #14201B">
<button onClick="{{ askHome }}" style="min-height: 52px; padding: 0 26px; border: 0; border-radius: 12px; background: #14201B; color: #FFFFFF; font-size: 16px; font-weight: 600">Otsi</button>
</div>

<div style="display: flex; flex-wrap: wrap; gap: 24px; margin-top: 36px">
<section style="flex: 999 1 520px; min-width: 0">
<div style="display: flex; justify-content: space-between; align-items: baseline; gap: 10px; margin-bottom: 12px">
<h2 style="margin: 0; font-family: 'Space Grotesk', sans-serif; font-size: 24px">Kogukonnas <span style="display: inline-block; vertical-align: middle; margin-left: 6px; padding: 3px 10px; border-radius: 999px; background: #FFF4E0; color: #5C3B00; font-family: Inter, sans-serif; font-size: 12px; font-weight: 600">Näidisarutelud</span></h2>
<button onClick="{{ goQa }}" style="background: none; border: 0; padding: 0; min-height: 40px; color: #0B5C43; font-size: 15px; font-weight: 600">Kõik arutelud →</button>
</div>
<p style="margin: 0 0 10px; font-size: 14px; color: #4B5A53">Kogukond avaneb peagi. Praegu näed näidisküsimusi, mis näitavad, millest siin räägitakse.</p>
<div style="display: flex; flex-direction: column; gap: 8px">
<sc-for list="{{ latestQs }}" as="l" hint-placeholder-count="4">
<button onClick="{{ l.pick }}" style="text-align: left; padding: 14px 18px; border: 1px solid #E2E6E1; border-radius: 12px; background: #FFFFFF; color: #14201B; display: flex; flex-direction: column; gap: 4px">
<span style="display: inline-flex; align-items: center; gap: 6px; font-size: 13px; font-weight: 600; color: #2B3A33"><span style="width: 9px; height: 9px; border-radius: 999px; background: {{ l.dot }}"></span>{{ l.cat }} · <span style="font-weight: 400; color: #4B5A53">{{ l.topicTitle }}</span></span>
<span style="font-size: 16px; font-weight: 600">{{ l.title }}</span>
<span style="font-size: 13px; color: #4B5A53">{{ l.meta }}</span>
</button>
</sc-for>
</div>
</section>
<aside style="flex: 1 1 280px; display: flex; flex-direction: column; gap: 10px">
<h2 style="margin: 0 0 2px; font-family: 'Space Grotesk', sans-serif; font-size: 24px">Tööriistad</h2>
<sc-for list="{{ tools }}" as="t" hint-placeholder-count="3">
<button onClick="{{ t.pick }}" style="text-align: left; background: #FFFFFF; border: 1px solid #E2E6E1; border-radius: 12px; padding: 16px 18px; display: flex; flex-direction: column; gap: 4px">
<span style="font-family: 'Space Grotesk', sans-serif; font-size: 18px; font-weight: 600; color: #14201B">{{ t.title }}</span>
<span style="font-size: 14px; color: #4B5A53">{{ t.text }}</span>
</button>
</sc-for>
</aside>
</div>
</sc-if>

<sc-if value="{{ isTopics }}" hint-placeholder-val="{{ false }}">
<h1 style="margin: 0 0 8px; font-family: 'Space Grotesk', sans-serif; font-size: 36px">Õpi 10 sammuga</h1>
<p style="margin: 0 0 24px; color: #4B5A53; max-width: 640px">Alusta esimesest ja liigu järjest. Iga samm algab lihtsast selgitusest ja lõpeb ühe kontrollküsimusega. {{ progressLabel }}</p>
<sc-if value="{{ allDone }}" hint-placeholder-val="{{ false }}">
<button onClick="{{ goNext2 }}" style="width: 100%; max-width: 760px; text-align: left; margin-bottom: 16px; padding: 18px 20px; border: 0; border-radius: 14px; background: #0E6B4F; color: #FFFFFF; display: flex; flex-direction: column; gap: 4px"><span style="font-family: 'Space Grotesk', sans-serif; font-size: 20px; font-weight: 700">Kõik 10 sammu läbitud. Mis edasi? →</span><span style="font-size: 15px; color: #DDEFE7">8 sammu esimese päris investeeringuni, iga sammu juures tööriist.</span></button>
</sc-if>
<ol style="margin: 0; padding: 0; list-style: none; display: flex; flex-direction: column; gap: 8px; max-width: 760px">
<sc-for list="{{ steps }}" as="s" hint-placeholder-count="10">
<li>
<button onClick="{{ s.pick }}" style="width: 100%; text-align: left; display: flex; align-items: center; gap: 16px; padding: 14px 18px; border: 1px solid #E2E6E1; border-radius: 12px; background: #FFFFFF; color: #14201B">
<span style="{{ s.numStyle }}">{{ s.mark }}</span>
<span style="flex: 1; display: flex; flex-direction: column; gap: 2px">
<span style="font-size: 17px; font-weight: 600">{{ s.title }}</span>
<span style="font-size: 14px; color: #4B5A53">{{ s.lead }}</span>
</span>
<span aria-hidden="true" style="font-size: 20px; color: #8A9A92">›</span>
</button>
</li>
</sc-for>
</ol>
<h2 style="margin: 36px 0 6px; font-family: 'Space Grotesk', sans-serif; font-size: 26px">Tase 2: esimesest ostust kogenud investoriks</h2>
<p style="margin: 0 0 16px; color: #4B5A53; max-width: 680px">Uued teemad neile, kes on põhitõed selgeks saanud või juba investeerivad. {{ progress2 }}</p>
<ol style="margin: 0; padding: 0; list-style: none; display: flex; flex-direction: column; gap: 8px; max-width: 760px">
<sc-for list="{{ steps2 }}" as="s" hint-placeholder-count="10">
<li>
<button onClick="{{ s.pick }}" style="width: 100%; text-align: left; display: flex; align-items: center; gap: 16px; padding: 14px 18px; border: 1px solid #D6E0F0; border-radius: 12px; background: #FFFFFF; color: #14201B">
<span style="{{ s.numStyle }}">{{ s.mark }}</span>
<span style="flex: 1; display: flex; flex-direction: column; gap: 2px">
<span style="font-size: 17px; font-weight: 600">{{ s.title }}</span>
<span style="font-size: 14px; color: #4B5A53">{{ s.lead }}</span>
</span>
<span aria-hidden="true" style="font-size: 20px; color: #8A9A92">›</span>
</button>
</li>
</sc-for>
</ol>
</sc-if>

<sc-if value="{{ isTopic }}" hint-placeholder-val="{{ false }}">
<div style="max-width: 760px; margin: 0 auto">
<div style="display: flex; flex-wrap: wrap; justify-content: space-between; align-items: center; gap: 8px">
<button onClick="{{ goTopics }}" style="background: none; border: 0; padding: 0; min-height: 44px; color: {{ accent }}; font-size: 15px; font-weight: 500">← Kõik sammud</button>
<span style="font-size: 14px; color: #4B5A53">{{ tx.stepLabel }}</span>
</div>
<article style="background: #FFFFFF; border: 1px solid #E2E6E1; border-radius: 16px; padding: 36px">
<h1 style="margin: 0 0 10px; font-family: 'Space Grotesk', sans-serif; font-size: 36px; line-height: 1.15">{{ topic.title }}</h1>
<p style="margin: 0 0 20px; font-size: 18px; color: #4B5A53">{{ topic.lead }}</p>
<p style="margin: 0; font-size: 17px; white-space: pre-line; color: #22302A">{{ tx.basic }}</p>

<sc-if value="{{ tx.showKesk }}" hint-placeholder-val="{{ false }}">
<h2 style="margin: 28px 0 10px; font-family: 'Space Grotesk', sans-serif; font-size: 22px">{{ tx.kesk.heading }}</h2>
<p style="margin: 0; font-size: 17px; white-space: pre-line; color: #22302A">{{ tx.kesk.body }}</p>
</sc-if>
<sc-if value="{{ tx.showEdasi }}" hint-placeholder-val="{{ false }}">
<h2 style="margin: 28px 0 10px; font-family: 'Space Grotesk', sans-serif; font-size: 22px">{{ tx.edasi.heading }}</h2>
<p style="margin: 0; font-size: 17px; white-space: pre-line; color: #22302A">{{ tx.edasi.body }}</p>
</sc-if>
<sc-if value="{{ tx.canMore }}" hint-placeholder-val="{{ true }}">
<button onClick="{{ tx.more }}" style="margin-top: 20px; min-height: 44px; padding: 0 18px; border: 1.5px solid #0E6B4F; border-radius: 10px; background: #FFFFFF; color: #0B5C43; font-size: 15px; font-weight: 600">{{ tx.moreLabel }}</button>
</sc-if>

<sc-if value="{{ tx.hasExample }}" hint-placeholder-val="{{ true }}">
<div style="margin-top: 28px; padding: 20px 22px; border-radius: 12px; border: 1px solid #E2E6E1; background: #FBFCFA">
<h3 style="margin: 0 0 6px; font-size: 16px; font-weight: 600">Näide</h3>
<p style="margin: 0; font-size: 16px; color: #22302A; white-space: pre-line">{{ tx.example }}</p>
</div>
</sc-if>

<div style="margin-top: 16px; padding: 20px 22px; border-radius: 12px; background: #E9F3EE">
<h3 style="margin: 0 0 6px; font-size: 16px; font-weight: 600; color: #0B4D39">Eestis</h3>
<p style="margin: 0; font-size: 16px; color: #1D3A2F; white-space: pre-line">{{ topic.estonia }}</p>
</div>

<sc-if value="{{ tx.hasQuiz }}" hint-placeholder-val="{{ true }}">
<div style="margin-top: 28px; padding: 20px 22px; border-radius: 12px; background: #F2F4F1">
<p style="margin: 0 0 4px; font-size: 13px; font-weight: 600; color: #0B4D39; text-transform: uppercase; letter-spacing: 0.04em">Kontrolli ennast</p>
<p style="margin: 0 0 12px; font-size: 17px; font-weight: 600">{{ tx.quizQ }}</p>
<div style="display: flex; flex-direction: column; gap: 8px">
<sc-for list="{{ tx.quizOpts }}" as="o" hint-placeholder-count="3">
<button onClick="{{ o.pick }}" style="{{ o.style }}">{{ o.label }}</button>
</sc-for>
</div>
<sc-if value="{{ tx.quizDone }}" hint-placeholder-val="{{ false }}">
<p style="margin: 12px 0 0; font-size: 15px; color: #22302A">{{ tx.quizResult }}</p>
<div style="margin-top: 14px; padding: 14px 16px; border-radius: 10px; background: #FFFFFF; border: 1.5px solid #0E6B4F; display: flex; flex-wrap: wrap; justify-content: space-between; align-items: center; gap: 10px">
<span style="font-size: 15px; font-weight: 600">Järgmine praktiline samm: {{ tx.tryText }}</span>
<button onClick="{{ tx.tryOpen }}" style="min-height: 44px; padding: 0 16px; border: 0; border-radius: 10px; background: {{ accent }}; color: #FFFFFF; font-size: 15px; font-weight: 600">{{ tx.tryLabel }}</button>
</div>
</sc-if>
</div>
</sc-if>

<button onClick="{{ tx.toggleExtras }}" aria-expanded="{{ tx.extrasExpanded }}" style="margin-top: 24px; width: 100%; text-align: left; min-height: 48px; padding: 0 16px; border: 1px solid #E2E6E1; border-radius: 10px; background: #FFFFFF; color: #14201B; font-size: 15px; font-weight: 600">{{ tx.extrasLabel }}</button>
<sc-if value="{{ tx.extrasOpen }}" hint-placeholder-val="{{ false }}">
<div style="padding: 16px 4px 0; display: flex; flex-direction: column; gap: 18px">
<sc-if value="{{ tx.hasMistakes }}" hint-placeholder-val="{{ true }}">
<div>
<h3 style="margin: 0 0 8px; font-size: 16px; font-weight: 600">Levinud vead</h3>
<ul style="margin: 0; padding-left: 20px; display: flex; flex-direction: column; gap: 6px; font-size: 15px; color: #22302A">
<sc-for list="{{ tx.mistakes }}" as="m" hint-placeholder-count="3">
<li>{{ m }}</li>
</sc-for>
</ul>
</div>
</sc-if>
<div>
<h3 style="margin: 0 0 8px; font-size: 16px; font-weight: 600">Seotud mõisted</h3>
<div style="display: flex; flex-wrap: wrap; gap: 8px">
<sc-for list="{{ tx.termChips }}" as="term" hint-placeholder-count="3">
<button onClick="{{ term.pick }}" style="min-height: 36px; padding: 0 12px; border: 1px solid #C9D1CB; border-radius: 999px; background: #FFFFFF; font-size: 14px; color: #2B3A33">{{ term.label }}</button>
</sc-for>
</div>
</div>
<sc-if value="{{ tx.hasSources }}" hint-placeholder-val="{{ false }}">
<div style="font-size: 14px">
<h3 style="margin: 0 0 8px; font-size: 16px; font-weight: 600">Allikad</h3>
<ul style="margin: 0; padding-left: 20px; display: flex; flex-direction: column; gap: 4px">
<sc-for list="{{ tx.sources }}" as="src" hint-placeholder-count="1">
<li><a href="{{ src.url }}" target="_blank" rel="noopener">{{ src.label }}</a></li>
</sc-for>
</ul>
</div>
</sc-if>
</div>
</sc-if>

<div style="margin-top: 28px; padding-top: 18px; border-top: 1px solid #E2E6E1; display: flex; flex-wrap: wrap; justify-content: space-between; gap: 10px">
<sc-if value="{{ tx.hasPrev }}" hint-placeholder-val="{{ true }}">
<button onClick="{{ tx.goPrev }}" style="min-height: 44px; padding: 0 14px; border: 1px solid #C9D1CB; border-radius: 10px; background: #FFFFFF; color: #14201B; font-size: 14px; text-align: left">{{ tx.prevLabel }}</button>
</sc-if>
<sc-if value="{{ tx.hasNext }}" hint-placeholder-val="{{ true }}">
<button onClick="{{ tx.goNext }}" style="margin-left: auto; min-height: 48px; padding: 0 18px; border: 0; border-radius: 10px; background: {{ accent }}; color: #FFFFFF; font-size: 15px; font-weight: 600; text-align: right">{{ tx.nextLabel }}</button>
</sc-if>
</div>
</article>
<section style="margin-top: 28px; background: #FFFFFF; border: 1px solid #E2E6E1; border-radius: 16px; padding: 28px 32px">
<h2 style="margin: 0 0 4px; font-family: 'Space Grotesk', sans-serif; font-size: 22px">Arutelu selle teema all</h2>
<p style="margin: 0 0 16px; font-size: 15px; color: #4B5A53">Küsimused, mida teised on sel teemal küsinud. Küsi julgelt ka ise, rumalaid küsimusi pole.</p>
<div style="display: flex; flex-direction: column; gap: 8px">
<sc-for list="{{ topicQs }}" as="l" hint-placeholder-count="2">
<button onClick="{{ l.pick }}" style="text-align: left; padding: 12px 16px; border: 1px solid #E2E6E1; border-radius: 10px; background: #FBFCFA; color: #14201B; display: flex; flex-direction: column; gap: 2px">
<span style="font-size: 16px; font-weight: 600">{{ l.title }}</span>
<span style="font-size: 13px; color: #4B5A53">{{ l.cat }} · {{ l.meta }}</span>
</button>
</sc-for>
</div>
<sc-if value="{{ topicQsEmpty }}" hint-placeholder-val="{{ false }}">
<p style="margin: 0; font-size: 15px; color: #4B5A53">Sel teemal pole veel küsitud. Ole esimene.</p>
</sc-if>
<div style="margin-top: 16px; display: flex; flex-direction: column; gap: 8px">

<div style="padding: 14px 16px; border-radius: 12px; background: #14201B; color: #FFFFFF"><p style="margin: 0; font-size: 14px; color: #C9D8D0">Tulumaks 22 %</p><p style="margin: 4px 0 0; font-family: 'Space Grotesk', sans-serif; font-size: 22px; font-weight: 700">{{ ik.tax }}</p></div>
</div>
<p style="margin: 0; font-size: 15px; color: #22302A">{{ ik.explain }}</p>

<section style="margin-top: 16px; background: #FFFFFF; border: 1px solid #E2E6E1; border-radius: 16px; padding: 24px">
<h2 style="margin: 0 0 10px; font-family: 'Space Grotesk', sans-serif; font-size: 22px">Deklaratsiooni täites samm-sammult</h2>
<ol style="margin: 0; padding-left: 22px; display: flex; flex-direction: column; gap: 8px; font-size: 16px">
<li><strong>Kontrolli eeltäidetud andmeid.</strong> Kui sinu pank või platvorm saadab investeerimiskonto aruande, on tabel 6.5 juba täidetud. Võrdle seda oma väljavõttega.</li>
<li><strong>Lisa välismaise maakleri konto.</strong> Tabeli 6.5 I osas märgi konto number ja ettevõtte nimi. Välismaa andmeid automaatselt ei tule.</li>
<li><strong>Lisa sisse- ja väljamaksed.</strong> Tabeli 6.5 II osas ainult rahaliikumised, mitte ostud ja müügid.</li>
<li><strong>Lisa välismaised dividendid.</strong> Kui välisriigis peeti maks kinni, märgi bruto ja kinnipeetud maks tabelisse 8.8 ning kätte saadud netosumma tabelisse 6.5 II sissemaksena.</li>
<li><strong>Kontrolli edasikantavat summat.</strong> See on järgmise aasta alguse jääk. Vea korral paranda alates kõige varasemast aastast.</li>
</ol>

<p style="margin: 0; font-size: 14px; color: #4B5A53">Tehingutasu: 0,14 %, vähemalt 3,90 € tehingu kohta, nagu välismaiste ETF-ide puhul Eesti pangas.</p>

</sc-for>

<div><label for="rtb" style="display: flex; justify-content: space-between; font-size: 15px; font-weight: 600"><span>Väärtus vahetult enne lisamist</span><span>{{ rt.bLabel }}</span></label><input id="rtb" type="range" min="500" max="150000" step="100" value="{{ rt.b }}" onChange="{{ rtSetB }}" style="width: 100%; accent-color: #0E6B4F; min-height: 32px"></div>

<span style="font-size: 13px; font-weight: 700; color: #A9D9C4; text-transform: uppercase; letter-spacing: 0.04em">Uus</span>

</sc-for>

</div>
</section>

<section class="no-print" style="margin-top: 16px; padding: 18px 20px; border-radius: 14px; background: #FFF4E0; border: 1px solid #F0D29A">

</ul>
</section>
</sc-if>

<section id="plan-print" style="margin-top: 16px; background: #FFFFFF; border: 2px solid #14201B; border-radius: 16px; padding: 28px">

</ul>

</div>
</sc-for>
</div>
<p style="margin: 0 0 6px; font-size: 16px; font-weight: 700">Minu reeglid</p>

<sc-for list="{{ plan.rules }}" as="r" hint-placeholder-count="4"><li>{{ r }}</li></sc-for>
</ol>
<p style="margin: 0; font-size: 13px; color: #4B5A53">Arvutused on näitlikud: aktsiate puhul eeldatud 6 % ja võlakirjade puhul 2 % aastast tootlust ning ajaloolisi suuri langusi. See ei ole prognoos ega investeerimissoovitus.</p>

<div class="no-print" style="margin-top: 14px; display: flex; flex-wrap: wrap; gap: 10px">
<button onClick="{{ planPrint }}" style="min-height: 48px; padding: 0 20px; border: 0; border-radius: 12px; background: {{ accent }}; color: #FFFFFF; font-size: 16px; font-weight: 600">Prindi või salvesta PDF-ina</button>
<button onClick="{{ goTase2 }}" style="min-height: 48px; padding: 0 18px; border: 1px solid #C9D1CB; border-radius: 12px; background: #FFFFFF; color: #14201B; font-size: 15px">Jätka Tase 2 õpiteega →</button>
</div>
</div>
</sc-if>

<sc-if value="{{ isTools }}" hint-placeholder-val="{{ false }}">
<h1 style="margin: 0 0 8px; font-family: 'Space Grotesk', sans-serif; font-size: 36px">Tööriistad</h1>
<p style="margin: 0 0 24px; color: #4B5A53; max-width: 640px">Arvuta, võrdle ja proovi järele ilma päris rahata.</p>

<sc-for list="{{ tools }}" as="t" hint-placeholder-count="3">
<button onClick="{{ t.pick }}" style="text-align: left; background: #FFFFFF; border: 1px solid #E2E6E1; border-radius: 16px; padding: 24px; display: flex; flex-direction: column; gap: 8px; min-height: 150px">
<span style="font-family: 'Space Grotesk', sans-serif; font-size: 22px; font-weight: 600; color: #14201B">{{ t.title }}</span>
<span style="font-size: 15px; color: #4B5A53">{{ t.text }}</span>
</button>
</sc-for>
</div>
</sc-if>

<sc-if value="{{ isGlossary }}" hint-placeholder-val="{{ false }}">
<h1 style="margin: 0 0 8px; font-family: 'Space Grotesk', sans-serif; font-size: 36px">Sõnastik</h1>
<p style="margin: 0 0 20px; color: #4B5A53">{{ glossCount }} mõistet lühidalt ja lihtsalt. Põhjalikum selgitus on teemalehel.</p>
<label for="gq" style="display: block; font-size: 14px; font-weight: 600; margin-bottom: 6px">Otsi mõistet</label>
<input id="gq" value="{{ glossQ }}" onChange="{{ setGlossQ }}" placeholder="nt dividend" style="width: 100%; max-width: 420px; box-sizing: border-box; min-height: 48px; padding: 0 16px; font-size: 16px; border: 1.5px solid #C9D1CB; border-radius: 12px; background: #FFFFFF">
<div role="group" aria-label="Kategooria" style="display: flex; flex-wrap: wrap; gap: 8px; margin-top: 16px">
<sc-for list="{{ glossCatOpts }}" as="c" hint-placeholder-count="7">
<button onClick="{{ c.pick }}" style="{{ c.style }}">{{ c.label }}</button>
</sc-for>
</div>
<dl style="margin: 24px 0 0; display: grid; grid-template-columns: repeat(auto-fill, minmax(300px, 1fr)); gap: 12px">
<sc-for list="{{ glossary }}" as="g" hint-placeholder-count="8">
<div style="background: #FFFFFF; border: 1px solid #E2E6E1; border-radius: 12px; padding: 18px 20px; display: flex; flex-direction: column; gap: 6px">
<dt style="font-family: 'Space Grotesk', sans-serif; font-size: 18px; font-weight: 600">{{ g.term }}</dt>
<dd style="margin: 0; font-size: 15px; color: #3A4943; flex: 1">{{ g.def }}</dd>
<dd style="margin: 4px 0 0; display: flex; flex-wrap: wrap; justify-content: space-between; align-items: center; gap: 8px">
<span style="font-size: 12px; color: #4B5A53">{{ g.cat }}</span>
<sc-if value="{{ g.hasTopic }}" hint-placeholder-val="{{ true }}">
<button onClick="{{ g.open }}" style="min-height: 36px; padding: 0 10px; border: 0; background: none; color: #0B5C43; font-size: 14px; font-weight: 600">Loe teemat →</button>
</sc-if>
</dd>
</div>
</sc-for>
</dl>
<sc-if value="{{ glossEmpty }}" hint-placeholder-val="{{ false }}">
<p style="margin: 20px 0 0; color: #4B5A53">Sellist mõistet sõnastikus veel pole. Küsi abiliselt.</p>
</sc-if>
</sc-if>

<sc-if value="{{ isQa }}" hint-placeholder-val="{{ false }}">
<h1 style="margin: 0 0 8px; font-family: 'Space Grotesk', sans-serif; font-size: 36px">Kogukond</h1>
<p style="margin: 0 0 18px; color: #4B5A53; max-width: 720px">Küsi, vasta ja aruta nii algaja kui ka kogenud investorina. Prototüübis on osa küsimusi ja vastuseid näidised.</p>
<div role="group" aria-label="Kategooria" style="display: flex; flex-wrap: wrap; gap: 8px; margin-bottom: 12px">
<sc-for list="{{ qaCatOpts }}" as="c" hint-placeholder-count="5">
<button onClick="{{ c.pick }}" style="{{ c.style }}">{{ c.label }}</button>
</sc-for>
</div>
<div style="display: flex; flex-wrap: wrap; align-items: center; gap: 10px; margin-bottom: 20px">
<label for="qatopic" style="font-size: 14px; font-weight: 600">Teema</label>
<select id="qatopic" value="{{ qaTopic }}" onChange="{{ setQaTopic }}" style="min-height: 40px; padding: 0 10px; font-size: 15px; border: 1.5px solid #C9D1CB; border-radius: 10px; background: #FFFFFF">
<option value="">Kõik teemad</option>
<sc-for list="{{ topicOpts }}" as="o" hint-placeholder-count="10">
<option value="{{ o.id }}">{{ o.title }}</option>
</sc-for>
</select>
<span style="font-size: 14px; color: #4B5A53">{{ qaCountLabel }}</span>
</div>
<div style="display: flex; flex-wrap: wrap; gap: 24px">
<section style="flex: 999 1 560px; min-width: 0; display: flex; flex-direction: column; gap: 12px">
<sc-if value="{{ qaEmpty }}" hint-placeholder-val="{{ false }}">
<p style="margin: 0; padding: 20px; border: 1px dashed #C9D1CB; border-radius: 12px; color: #4B5A53">Selle valikuga küsimusi veel pole. Esita esimene küsimus.</p>
</sc-if>
<sc-for list="{{ qaList }}" as="q" hint-placeholder-count="4">
<article style="background: #FFFFFF; border: 1px solid #E2E6E1; border-radius: 14px; padding: 20px 22px">
<div style="display: flex; flex-wrap: wrap; align-items: center; gap: 8px; margin-bottom: 8px">
<span style="display: inline-flex; align-items: center; gap: 6px; font-size: 13px; font-weight: 600; color: #2B3A33"><span style="width: 9px; height: 9px; border-radius: 999px; background: {{ q.dot }}"></span>{{ q.level }}</span>
<span style="font-size: 13px; color: #4B5A53">· {{ q.tag }}</span>
</div>
<button onClick="{{ q.toggle }}" style="background: none; border: 0; padding: 0; text-align: left; font-family: 'Space Grotesk', sans-serif; font-size: 19px; font-weight: 600; color: #14201B; min-height: 32px">{{ q.title }}</button>
<sc-if value="{{ q.open }}" hint-placeholder-val="{{ false }}">
<div style="margin-top: 12px; padding: 16px 18px; border-left: 0; border-radius: 10px; background: #F2F5F1">
<p style="margin: 0 0 6px; font-size: 13px; font-weight: 600; color: {{ accent }}">{{ q.answerLabel }}</p>
<p style="margin: 0; font-size: 15px; color: #22302A; white-space: pre-line">{{ q.answer }}</p>
<sc-if value="{{ q.waiting }}" hint-placeholder-val="{{ false }}">
<p style="margin: 10px 0 0; font-size: 14px; color: #5C3B00">Ootab kogukonna vastust. Kogenud liikmed saavad AI vastust täiendada või parandada.</p>
</sc-if>
</div>
<sc-for list="{{ q.replies }}" as="rep" hint-placeholder-count="0">
<div style="{{ rep.style }}">
<div style="display: flex; flex-wrap: wrap; justify-content: space-between; align-items: center; gap: 8px; margin-bottom: 6px">
<span style="font-size: 13px; font-weight: 600; color: #2B3A33">{{ rep.label }}</span>
<sc-if value="{{ rep.isBest }}" hint-placeholder-val="{{ false }}">
<span style="font-size: 12px; font-weight: 600; padding: 3px 10px; border-radius: 999px; background: #0E6B4F; color: #FFFFFF">Parim vastus</span>
</sc-if>
</div>
<p style="margin: 0; font-size: 15px; color: #22302A; white-space: pre-line">{{ rep.text }}</p>
<sc-if value="{{ rep.canMark }}" hint-placeholder-val="{{ false }}">
<button onClick="{{ rep.markBest }}" style="margin-top: 10px; min-height: 36px; padding: 0 12px; border: 1px solid #0E6B4F; border-radius: 8px; background: #FFFFFF; color: #0B5C43; font-size: 13px; font-weight: 600">Märgi parimaks vastuseks</button>
</sc-if>
</div>
</sc-for>
<div style="margin-top: 14px; display: flex; flex-direction: column; gap: 8px">
<label for="{{ q.nameId }}" style="font-size: 14px; font-weight: 600">Sinu nimi <span style="font-weight: 400; color: #4B5A53">(valikuline, tühjaks jättes oled anonüümne)</span></label>
<input id="{{ q.nameId }}" value="{{ myName }}" onChange="{{ setMyName }}" placeholder="nt Mari" style="max-width: 320px; min-height: 44px; padding: 0 12px; font-size: 15px; border: 1.5px solid #C9D1CB; border-radius: 10px">
<label for="{{ q.replyId }}" style="font-size: 14px; font-weight: 600">Sinu vastus</label>
<textarea id="{{ q.replyId }}" rows="3" value="{{ q.draft }}" onChange="{{ q.setDraft }}" placeholder="Jaga oma kogemust või selgitust. Ära anna konkreetseid ostusoovitusi." style="padding: 12px; font-size: 15px; border: 1.5px solid #C9D1CB; border-radius: 10px; resize: vertical; font-family: inherit"></textarea>
<div style="display: flex; flex-wrap: wrap; align-items: center; gap: 10px">
<button onClick="{{ q.send }}" style="min-height: 44px; padding: 0 18px; border: 0; border-radius: 10px; background: {{ accent }}; color: #FFFFFF; font-size: 15px; font-weight: 600">Vasta</button>
<span style="font-size: 13px; color: #4B5A53">Vastused on kogukonna kogemused, mitte investeerimissoovitused.</span>
</div>
</div>
</sc-if>
<div style="display: flex; flex-wrap: wrap; align-items: center; gap: 12px; margin-top: 10px">
<button onClick="{{ q.vote }}" aria-label="Märgi kasulikuks" style="{{ q.voteStyle }}"><svg width="14" height="14" viewBox="0 0 14 14" aria-hidden="true"><path d="M7 2l5 7H2z" fill="currentColor"></path></svg>{{ q.votes }}</button>
<span style="font-size: 13px; color: #4B5A53">{{ q.meta }}</span>
</div>
</article>
</sc-for>
</section>
<aside style="flex: 1 1 280px">
<form style="background: #FFFFFF; border: 1px solid #E2E6E1; border-radius: 16px; padding: 22px; display: flex; flex-direction: column; gap: 10px">
<h2 style="margin: 0; font-size: 18px">Esita küsimus</h2>
<label for="qn" style="font-size: 14px; font-weight: 600">Sinu nimi <span style="font-weight: 400; color: #4B5A53">(valikuline)</span></label>
<input id="qn" value="{{ myName }}" onChange="{{ setMyName }}" placeholder="Tühjaks jättes anonüümne" style="min-height: 44px; padding: 0 12px; font-size: 15px; border: 1.5px solid #C9D1CB; border-radius: 10px"><label for="qt" style="font-size: 14px; font-weight: 600">Sinu küsimus</label>
<textarea id="qt" rows="4" value="{{ newQ }}" onChange="{{ setNewQ }}" placeholder="Kirjelda, mida tahad teada" style="padding: 12px; font-size: 15px; border: 1.5px solid #C9D1CB; border-radius: 10px; resize: vertical"></textarea>
<label for="ql" style="font-size: 14px; font-weight: 600">Kategooria</label>
<select id="ql" value="{{ newCat }}" onChange="{{ setNewCat }}" style="min-height: 44px; padding: 0 10px; font-size: 15px; border: 1.5px solid #C9D1CB; border-radius: 10px; background: #FFFFFF">
<sc-for list="{{ catNames }}" as="c" hint-placeholder-count="4">
<option value="{{ c }}">{{ c }}</option>
</sc-for>
</select>
<label for="qtp" style="font-size: 14px; font-weight: 600">Teema</label>
<select id="qtp" value="{{ newTopic }}" onChange="{{ setNewTopic }}" style="min-height: 44px; padding: 0 10px; font-size: 15px; border: 1.5px solid #C9D1CB; border-radius: 10px; background: #FFFFFF">
<sc-for list="{{ topicOpts }}" as="o" hint-placeholder-count="10">
<option value="{{ o.id }}">{{ o.title }}</option>
</sc-for>
</select>
<button type="button" onClick="{{ postQ }}" style="min-height: 44px; border: 0; border-radius: 10px; background: {{ accent }}; color: #FFFFFF; font-size: 15px; font-weight: 600">Postita küsimus</button>
<p style="margin: 0; font-size: 13px; color: #4B5A53">Vastused on kogukonna arvamused, mitte investeerimissoovitused.</p>
</form>
</aside>
</div>
</sc-if>

<sc-if value="{{ isCalc }}" hint-placeholder-val="{{ false }}">
<button onClick="{{ goTools }}" style="background: none; border: 0; padding: 0; min-height: 44px; color: {{ accent }}; font-size: 15px; font-weight: 500">← Tööriistad</button>
<h1 style="margin: 0 0 8px; font-family: 'Space Grotesk', sans-serif; font-size: 36px">Palju ma kogun?</h1>

<label for="cy" style="display: flex; justify-content: space-between; font-size: 15px; font-weight: 600"><span>Periood</span><span>{{ yearsLabel }}</span></label>

<input id="cr" type="range" min="0" max="12" step="0.5" value="{{ rate }}" onChange="{{ setRate }}" style="width: 100%; accent-color: #0E6B4F; min-height: 32px">
</div>
</section>
<section style="flex: 1 1 360px; display: flex; flex-direction: column; gap: 14px">
<div style="background: #14201B; color: #FFFFFF; border-radius: 16px; padding: 28px">
<p style="margin: 0; font-size: 14px; color: #C9D8D0">Kogutud summa perioodi lõpuks</p>
<p style="margin: 4px 0 0; font-family: 'Space Grotesk', sans-serif; font-size: 44px; font-weight: 700">{{ totalLabel }}</p>
</div>
<div style="display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 14px">
<div style="background: #FFFFFF; border: 1px solid #E2E6E1; border-radius: 14px; padding: 20px">
<p style="margin: 0; font-size: 14px; color: #4B5A53">Sinu sissemaksed</p>
<p style="margin: 4px 0 0; font-family: 'Space Grotesk', sans-serif; font-size: 26px; font-weight: 600">{{ depositsLabel }}</p>
</div>
<div style="background: #FFFFFF; border: 1px solid #E2E6E1; border-radius: 14px; padding: 20px">
<p style="margin: 0; font-size: 14px; color: #4B5A53">Kasv tootlusest</p>
<p style="margin: 4px 0 0; font-family: 'Space Grotesk', sans-serif; font-size: 26px; font-weight: 600; color: #0B5C43">{{ gainLabel }}</p>
</div>
</div>
<p style="margin: 0; font-size: 14px; color: #4B5A53">Arvutus ei arvesta tasude, maksude ega inflatsiooniga.</p>
<button onClick="{{ goFees }}" style="align-self: flex-start; min-height: 44px; padding: 0 16px; border: 1px solid #0E6B4F; border-radius: 10px; background: #FFFFFF; color: #0B5C43; font-size: 15px; font-weight: 600">Vaata, palju tasud sellest ära võtavad →</button>
</section>
</div>
</sc-if>

<button onClick="{{ o.pick }}" style="{{ o.style }}">{{ o.label }}</button>
</sc-for>
</div>
</div>
<div>

<script>
/* Väike renderdaja: loeb <template id="tpl"> sisu ({{ }}, sc-for, sc-if, onClick jne)
   ja uuendab lehte iga olekumuutuse järel ilma elemente asendamata. */
(function () {
  var HOLE = /\{\{\s*([^}]+?)\s*\}\}/g;
  var WHOLE = /^\s*\{\{\s*([^}]+?)\s*\}\}\s*$/;
  var EVENTS = { onclick: 'click', onkeydown: 'keydown', onchange: 'input' };

  function lookup(scope, path) {
    if (path === 'true') return true;
    if (path === 'false') return false;
    if (/^-?\d+(\.\d+)?$/.test(path)) return Number(path);
    var parts = path.split('.'), v = scope;
    for (var i = 0; i < parts.length; i++) {
      if (v == null) return undefined;
      v = v[parts[i]];
    }
    return v;
  }
  function interp(str, scope) {
    return str.replace(HOLE, function (_, p) { var v = lookup(scope, p); return v == null ? '' : String(v); });
  }

  function build(node, scope, out) {
    if (node.nodeType === 3) { out.push(document.createTextNode(interp(node.nodeValue, scope))); return; }
    if (node.nodeType !== 1) return;
    var tag = node.localName;
    if (tag === 'sc-for') {
      var list = lookup(scope, (node.getAttribute('list').match(WHOLE) || [])[1] || '') || [];
      var as = node.getAttribute('as') || 'item';
      list.forEach(function (item, i) {
        var s = Object.create(scope); s[as] = item; s.$index = i;
        node.childNodes.forEach(function (c) { build(c, s, out); });
      });
      return;
    }
    if (tag === 'sc-if') {
      var val = lookup(scope, (node.getAttribute('value').match(WHOLE) || [])[1] || '');
      if (val) node.childNodes.forEach(function (c) { build(c, scope, out); });
      return;
    }
    var el = node.namespaceURI && node.namespaceURI !== 'http://www.w3.org/1999/xhtml'
      ? document.createElementNS(node.namespaceURI, node.nodeName)
      : document.createElement(tag);
    el.__h = {};
    var value;
    Array.prototype.forEach.call(node.attributes, function (a) {
      var name = a.name, low = name.toLowerCase();
      if (low.indexOf('hint-') === 0) return;
      var whole = a.value.match(WHOLE);
      if (EVENTS[low]) {
        var fn = whole ? lookup(scope, whole[1]) : null;
        var type = EVENTS[low];
        if (low === 'onchange' && tag === 'select') type = 'change';
        if (typeof fn === 'function') el.__h[type] = fn;
        return;
      }
      var v = whole ? lookup(scope, whole[1]) : interp(a.value, scope);
      if (low === 'value' && (tag === 'input' || tag === 'textarea' || tag === 'select')) { value = v == null ? '' : String(v); return; }
      if (v === false || v == null) return;
      el.setAttribute(name, v === true ? '' : String(v));
    });
    var kids = [];
    node.childNodes.forEach(function (c) { build(c, scope, kids); });
    kids.forEach(function (k) { el.appendChild(k); });
    if (value !== undefined) el.__val = value;
    out.push(el);
  }

  function setVal(el) {
    if (el.__val !== undefined && el.value !== el.__val) el.value = el.__val;
  }
  function adopt(el) {
    if (el.nodeType !== 1) return;
    setVal(el);
    Array.prototype.forEach.call(el.children, adopt);
  }
  function morph(oldEl, newEl) {
    if (oldEl.nodeType !== newEl.nodeType || oldEl.nodeName !== newEl.nodeName) {
      oldEl.parentNode.replaceChild(newEl, oldEl); adopt(newEl); return;
    }
    if (oldEl.nodeType === 3) { if (oldEl.nodeValue !== newEl.nodeValue) oldEl.nodeValue = newEl.nodeValue; return; }
    var i, a;
    for (i = oldEl.attributes.length - 1; i >= 0; i--) {
      a = oldEl.attributes[i];
      if (!newEl.hasAttribute(a.name)) oldEl.removeAttribute(a.name);
    }
    for (i = 0; i < newEl.attributes.length; i++) {
      a = newEl.attributes[i];
      if (oldEl.getAttribute(a.name) !== a.value) oldEl.setAttribute(a.name, a.value);
    }
    oldEl.__h = newEl.__h;
    oldEl.__val = newEl.__val;
    morphChildren(oldEl, newEl);
    setVal(oldEl);
  }
  function morphChildren(oldP, newP) {
    if (oldP.nodeType === 1 && oldP.hasAttribute && oldP.hasAttribute('data-keep')) return;
    var olds = Array.prototype.slice.call(oldP.childNodes);
    var news = Array.prototype.slice.call(newP.childNodes);
    for (var i = 0; i < news.length; i++) {
      if (i < olds.length) morph(olds[i], news[i]);
      else { oldP.appendChild(news[i]); adopt(news[i]); }
    }
    for (var j = news.length; j < olds.length; j++) oldP.removeChild(olds[j]);
  }

  window.DCLogic = function DCLogic(props) { this.props = props || {}; this.state = {}; };
  window.DCLogic.prototype.setState = function (part) {
    Object.assign(this.state, typeof part === 'function' ? part(this.state) : part);
    this.forceUpdate();
  };
  window.DCLogic.prototype.forceUpdate = function () {
    var self = this;
    if (self.__queued) return;
    self.__queued = true;
    Promise.resolve().then(function () { self.__queued = false; self.__render(); });
  };

  window.mountDC = function (Component, root, tpl, opts) {
    opts = opts || {};
    var inst = new Component({});
    if (opts.load) { try { Object.assign(inst.state, opts.load() || {}); } catch (e) {} }
    var src = document.createElement('div');
    src.appendChild(tpl.content.cloneNode(true));
    inst.__render = function () {
      var scope = inst.renderVals();
      var holder = document.createElement('div');
      var out = [];
      src.childNodes.forEach(function (c) { build(c, scope, out); });
      out.forEach(function (n) { holder.appendChild(n); });
      morphChildren(root, holder);
      if (opts.afterRender) { try { opts.afterRender(root); } catch (e) {} }
      if (opts.save) { try { opts.save(inst.state); } catch (e) {} }
    };
    ['click', 'input', 'change', 'keydown'].forEach(function (type) {
      root.addEventListener(type, function (e) {
        var el = e.target;
        while (el && el !== root) {
          if (el.__h && el.__h[type]) { el.__h[type](e); return; }
          el = el.parentNode;
        }
      });
    });
    root.addEventListener('submit', function (e) { e.preventDefault(); });
    inst.__render();
    return inst;
  };
})();

</script>
<script>
class Component extends DCLogic {
  constructor(props) {
    super(props);
    this.state = { screen: 'home', level: 'algaja', topicId: 'etf', homeQ: '', aiQ: '', asked: 'Mis on ETF?', glossQ: '', monthly: 100, years: 20, rate: 6, openQ: 'q0', feeMonthly: 100, feeTrades: 1, feeAsset: 'etf', fb: 'none', userQs: [], votes: {}, replies: {}, drafts: {}, best: {} };
    Object.assign(this.state, this.pfStart());
    Object.assign(this.state, { pf2Alloc: 60, pf2Ev: this.pf2Make(), pf2Shown: 0 });
  }
  pfAssets() {
    return [
      { id: 'world', name: 'Maailma aktsiate ETF', risk: 'keskmine', mu: 0.006, sigma: 0.04 },
      { id: 'usa', name: 'USA suurettevõtete ETF', risk: 'keskmine', mu: 0.007, sigma: 0.05 },
      { id: 'eur', name: 'Euroopa aktsiate ETF', risk: 'keskmine', mu: 0.005, sigma: 0.045 },
      { id: 'bond', name: 'Euro võlakirjade ETF', risk: 'madal', mu: 0.002, sigma: 0.012 },
      { id: 'single', name: 'Üks tehnoloogiaettevõte (näidis)', risk: 'kõrge', mu: 0.008, sigma: 0.12 }
    ];
  }
  pfStart() {
    var prices = {}, moves = {};
    this.pfAssets().forEach(function (a) { prices[a.id] = 100; moves[a.id] = 0; });
    return { pfCash: 1000, pfUnits: {}, pfPrices: prices, pfMoves: moves, pfMonth: 0, pfHist: [1000], pfAmt: 100, pfLog: ['Said 1000 virtuaalset eurot.'] };
  }
  pfTotal(st) {
    var t = st.pfCash;
    Object.keys(st.pfUnits).forEach(function (k) { t += st.pfUnits[k] * st.pfPrices[k]; });
    return t;
  }
  pfStep(st, months) {
    var assets = this.pfAssets();
    var prices = Object.assign({}, st.pfPrices), hist = st.pfHist.slice(), moves = {};
    var start = {};
    assets.forEach(function (a) { start[a.id] = prices[a.id]; });
    for (var m = 0; m < months; m++) {
      assets.forEach(function (a) {
        var u = 1 - Math.random(), v = Math.random();
        var g = Math.sqrt(-2 * Math.log(u)) * Math.cos(2 * Math.PI * v);
        prices[a.id] = Math.max(1, prices[a.id] * (1 + a.mu + a.sigma * g));
      });
      hist.push(this.pfTotal({ pfCash: st.pfCash, pfUnits: st.pfUnits, pfPrices: prices }));
    }
    assets.forEach(function (a) { moves[a.id] = prices[a.id] / start[a.id] - 1; });
    var month = st.pfMonth + months;
    var log = [(months === 1 ? 'Möödus 1 kuu.' : 'Möödus ' + months + ' kuud.') + ' Portfell: ' + Math.round(hist[hist.length - 1]) + ' €'].concat(st.pfLog).slice(0, 6);
    this.setState({ pfPrices: prices, pfHist: hist, pfMonth: month, pfMoves: moves, pfLog: log });
  }

  pf2Make() {
    var pool = this.pf2Pool(), total = 0;
    pool.forEach(function (e) { total += e.w; });
    var pick = function () {
      var r = Math.random() * total;
      for (var i = 0; i < pool.length; i++) { r -= pool[i].w; if (r <= 0) return i; }
      return 0;
    };
    var out = [];
    for (var y = 0; y < 10; y++) {
      var k = pick();
      out.push({ k: k, s: Math.round(pool[k].s + (Math.random() * 6 - 3)), b: Math.round(pool[k].b + (Math.random() * 2 - 1)) });
    }
    if (!out.some(function (e) { return e.s <= -9; })) {
      var at = 2 + Math.floor(Math.random() * 6);
      out[at] = { k: 6, s: -20 + Math.round(Math.random() * 6 - 3), b: 5 };
    }
    return out;
  }
  pf2Path(ev, alloc, n) {
    var w = alloc / 100, v = 1000, vals = [1000], peak = 1000, dd = 0, rets = [];
    for (var i = 0; i < n; i++) {
      var r = w * ev[i].s + (1 - w) * ev[i].b;
      rets.push(r);
      v = v * (1 + r / 100);
      vals.push(v);
      if (v > peak) peak = v;
      var d = v / peak - 1;
      if (d < dd) dd = d;
    }
    return { vals: vals, dd: dd, rets: rets };
  }

      monthlyLabel: this.fmt(s.monthly),

      aiQ: s.aiQ,
      setAiQ: function (e) { self.setState({ aiQ: e.target.value }); },
      aiKey: function (e) { if (e.key === 'Enter') self.ask(s.aiQ); },
      askAi: function () { self.ask(s.aiQ); }
    };
  }
}
