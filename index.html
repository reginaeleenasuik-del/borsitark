<!doctype html>
<html lang="et">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Börsitark – investeerimine selges eesti keeles</title>
<meta name="description" content="Investeerimine selges eesti keeles: teemad kolmel tasemel, sõnastik, kalkulaatorid, tasude võrdlus ja harjutusportfell.">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600&amp;family=Space+Grotesk:wght@500;600;700&amp;display=swap">
<style>
body{margin:0;background:#F6F7F4}
a{color:#0E6B4F}a:hover{color:#08523C}
button{font-family:inherit;cursor:pointer}
input,textarea{font-family:inherit}
</style>
<style>
*,*::before,*::after{box-sizing:border-box}
input,textarea,select{max-width:100%}
h1,h2{overflow-wrap:anywhere}
@media (max-width:640px){
  main{padding:20px 14px 48px !important}
  main section,main article,main aside>div,main aside>form{padding:20px !important}
  main h1{font-size:30px !important;line-height:1.15 !important}
  header nav button{padding:0 10px !important;font-size:14px !important}
}
</style>
</head>
<body>
<div id="app"></div>
<template id="tpl">
<div style="min-height: 100vh; background: #F6F7F4; color: #14201B; font-family: Inter, system-ui, sans-serif; font-size: 16px; line-height: 1.55">

<header style="background: #FFFFFF; border-bottom: 1px solid #E2E6E1">
<div style="max-width: 1120px; margin: 0 auto; padding: 14px 24px; display: flex; flex-wrap: wrap; align-items: center; justify-content: space-between; gap: 12px">
<button onClick="{{ goHome }}" style="display: flex; align-items: center; gap: 10px; background: none; border: 0; padding: 6px 0; min-height: 44px">
<svg width="28" height="28" viewBox="0 0 28 28" aria-hidden="true"><rect width="28" height="28" rx="7" fill="{{ accent }}"></rect><path d="M6 19l5-5 4 3 7-8" stroke="#FFFFFF" stroke-width="2.4" fill="none" stroke-linecap="round" stroke-linejoin="round"></path></svg>
<span style="font-family: 'Space Grotesk', sans-serif; font-weight: 700; font-size: 21px; color: #14201B">Börsitark</span>
</button>
<nav aria-label="Peamenüü" style="display: flex; flex-wrap: wrap; gap: 4px">
<sc-for list="{{ nav }}" as="n" hint-placeholder-count="6">
<button onClick="{{ n.pick }}" style="{{ n.style }}">{{ n.label }}</button>
</sc-for>
</nav>
</div>
</header>

<main style="max-width: 1120px; margin: 0 auto; padding: 32px 24px 64px">

<sc-if value="{{ isHome }}" hint-placeholder-val="{{ true }}">
<section style="background: #FFFFFF; border: 1px solid #E2E6E1; border-radius: 20px; padding: 48px 40px; display: flex; flex-direction: column; gap: 20px">
<p style="margin: 0; font-size: 14px; font-weight: 600; color: {{ accent }}; letter-spacing: 0.04em; text-transform: uppercase">Algajast edasijõudnuni</p>
<h1 style="margin: 0; font-family: 'Space Grotesk', sans-serif; font-size: 44px; line-height: 1.1; max-width: 720px">Investeerimine selges eesti keeles</h1>
<p style="margin: 0; font-size: 18px; color: #4B5A53; max-width: 640px">Iga teema on selgitatud kolmel tasemel ja Eesti reeglite järgi. Küsi, õpi järjest või arvuta läbi oma eesmärk.</p>
<div style="display: flex; flex-wrap: wrap; gap: 10px; max-width: 720px">
<label for="homeq" style="position: absolute; left: -9999px">Küsi ükskõik mida investeerimise kohta</label>
<input id="homeq" value="{{ homeQ }}" onChange="{{ setHomeQ }}" onKeyDown="{{ homeKey }}" placeholder="Küsi ükskõik mida, nt mis on ETF?" style="flex: 1 1 320px; min-height: 52px; padding: 0 18px; font-size: 17px; border: 1.5px solid #C9D1CB; border-radius: 12px; background: #FBFCFA; color: #14201B">
<button onClick="{{ askHome }}" style="min-height: 52px; padding: 0 26px; border: 0; border-radius: 12px; background: {{ accent }}; color: #FFFFFF; font-size: 16px; font-weight: 600">Küsi</button>
</div>
<div style="display: flex; flex-wrap: wrap; gap: 8px">
<sc-for list="{{ chips }}" as="c" hint-placeholder-count="3">
<button onClick="{{ c.pick }}" style="min-height: 40px; padding: 0 14px; border: 1px solid #C9D1CB; border-radius: 999px; background: #FFFFFF; color: #2B3A33; font-size: 14px">{{ c.label }}</button>
</sc-for>
</div>
</section>

<h2 style="margin: 48px 0 16px; font-family: 'Space Grotesk', sans-serif; font-size: 26px">Kust alustada?</h2>
<div style="display: grid; grid-template-columns: repeat(auto-fit, minmax(260px, 1fr)); gap: 16px">
<sc-for list="{{ doors }}" as="d" hint-placeholder-count="3">
<button onClick="{{ d.pick }}" style="text-align: left; background: #FFFFFF; border: 1px solid #E2E6E1; border-radius: 16px; padding: 24px; display: flex; flex-direction: column; gap: 10px; min-height: 170px">
<span style="display: inline-flex; align-items: center; gap: 8px; font-size: 13px; font-weight: 600; color: #2B3A33"><span style="width: 10px; height: 10px; border-radius: 999px; background: {{ d.dot }}"></span>{{ d.level }}</span>
<span style="font-family: 'Space Grotesk', sans-serif; font-size: 22px; font-weight: 600; color: #14201B">{{ d.title }}</span>
<span style="font-size: 15px; color: #4B5A53">{{ d.text }}</span>
</button>
</sc-for>
</div>

<div style="display: flex; flex-wrap: wrap; gap: 24px; margin-top: 48px">
<section style="flex: 999 1 560px; min-width: 0; background: #FFFFFF; border: 1px solid #E2E6E1; border-radius: 16px; padding: 28px">
<h2 style="margin: 0 0 6px; font-family: 'Space Grotesk', sans-serif; font-size: 24px">Õpiteekond: 10 sammu esimese investeeringuni</h2>
<p style="margin: 0 0 18px; color: #4B5A53; font-size: 15px">Iga samm avab teemalehe, kus on selgitus kolmel tasemel, näide ja kontrollküsimus.</p>
<ol style="margin: 0; padding: 0; list-style: none; display: flex; flex-direction: column; gap: 6px">
<sc-for list="{{ steps }}" as="s" hint-placeholder-count="10">
<li style="display: flex; align-items: center; gap: 14px; padding: 10px 12px; border-radius: 10px; background: {{ s.bg }}">
<span style="width: 30px; height: 30px; flex: none; border-radius: 999px; display: flex; align-items: center; justify-content: center; font-size: 14px; font-weight: 600; background: {{ s.numBg }}; color: {{ s.numColor }}">{{ s.n }}</span>
<span style="flex: 1; font-size: 15px">{{ s.label }}</span>
<sc-if value="{{ s.open }}" hint-placeholder-val="{{ false }}">
<button onClick="{{ s.pick }}" style="min-height: 36px; padding: 0 14px; border: 0; border-radius: 8px; background: {{ accent }}; color: #FFFFFF; font-size: 14px; font-weight: 500">Ava</button>
</sc-if>
</li>
</sc-for>
</ol>
</section>
<aside style="flex: 1 1 280px; display: flex; flex-direction: column; gap: 16px">
<button onClick="{{ goCalc }}" style="text-align: left; background: #14201B; color: #FFFFFF; border: 0; border-radius: 16px; padding: 24px; display: flex; flex-direction: column; gap: 8px">
<span style="font-size: 13px; font-weight: 600; color: #A9D9C4; text-transform: uppercase; letter-spacing: 0.04em">Kalkulaator</span>
<span style="font-family: 'Space Grotesk', sans-serif; font-size: 22px; font-weight: 600">Palju ma kogun, kui investeerin igal kuul?</span>
<span style="font-size: 15px; color: #D4DDD8">Liitintressi mõju näitlikult lahti arvutatud.</span>
</button>
<button onClick="{{ goPf }}" style="text-align: left; background: #E9F3EE; border: 1px solid #BFDCCF; border-radius: 16px; padding: 24px; display: flex; flex-direction: column; gap: 8px">
<span style="font-size: 13px; font-weight: 600; color: #0B4D39; text-transform: uppercase; letter-spacing: 0.04em">Harjutusportfell</span>
<span style="font-family: 'Space Grotesk', sans-serif; font-size: 22px; font-weight: 600; color: #14201B">Proovi 1000 virtuaalse euroga</span>
<span style="font-size: 15px; color: #2B3A33">Õpi investeerima ilma päris raha riskimata.</span>
</button>
<button onClick="{{ goQa }}" style="text-align: left; background: #FFFFFF; border: 1px solid #E2E6E1; border-radius: 16px; padding: 24px; display: flex; flex-direction: column; gap: 8px">
<span style="font-size: 13px; font-weight: 600; color: {{ accent }}; text-transform: uppercase; letter-spacing: 0.04em">Kogukond</span>
<span style="font-family: 'Space Grotesk', sans-serif; font-size: 22px; font-weight: 600; color: #14201B">Küsi teistelt investoritelt</span>
<span style="font-size: 15px; color: #4B5A53">Algajate küsimused, kogenumate vastused.</span>
</button>
</aside>
</div>
</sc-if>

<sc-if value="{{ isTopics }}" hint-placeholder-val="{{ false }}">
<h1 style="margin: 0 0 8px; font-family: 'Space Grotesk', sans-serif; font-size: 36px">Teemad</h1>
<p style="margin: 0 0 24px; color: #4B5A53">Vali tase. Teema avaneb valitud tasemel, aga saad seda lehel alati vahetada.</p>
<div role="group" aria-label="Tase" style="display: flex; flex-wrap: wrap; gap: 8px; margin-bottom: 24px">
<sc-for list="{{ levelTabs }}" as="t" hint-placeholder-count="3">
<button onClick="{{ t.pick }}" style="{{ t.style }}"><span style="width: 10px; height: 10px; border-radius: 999px; background: {{ t.dot }}"></span>{{ t.label }}</button>
</sc-for>
</div>
<div style="display: grid; grid-template-columns: repeat(auto-fill, minmax(240px, 1fr)); gap: 16px">
<sc-for list="{{ topicCards }}" as="c" hint-placeholder-count="8">
<button onClick="{{ c.pick }}" style="{{ c.style }}">
<span style="font-family: 'Space Grotesk', sans-serif; font-size: 20px; font-weight: 600; color: #14201B">{{ c.title }}</span>
<span style="font-size: 14px; color: #4B5A53">{{ c.text }}</span>
<span style="font-size: 13px; font-weight: 600; color: {{ c.badgeColor }}">{{ c.badge }}</span>
</button>
</sc-for>
</div>
</sc-if>

<sc-if value="{{ isTopic }}" hint-placeholder-val="{{ false }}">
<div style="display: flex; flex-wrap: wrap; justify-content: space-between; align-items: center; gap: 8px">
<button onClick="{{ goTopics }}" style="background: none; border: 0; padding: 0; min-height: 44px; color: {{ accent }}; font-size: 15px; font-weight: 500">← Kõik teemad</button>
<span style="font-size: 14px; color: #4B5A53">{{ tx.stepLabel }}</span>
</div>
<h1 style="margin: 4px 0 8px; font-family: 'Space Grotesk', sans-serif; font-size: 40px">{{ topic.title }}</h1>
<p style="margin: 0 0 24px; font-size: 18px; color: #4B5A53; max-width: 720px">{{ topic.lead }}</p>
<div role="tablist" aria-label="Selgituse tase" style="display: flex; flex-wrap: wrap; gap: 8px; margin-bottom: 20px">
<sc-for list="{{ levelTabs }}" as="t" hint-placeholder-count="3">
<button role="tab" onClick="{{ t.pick }}" style="{{ t.style }}"><span style="width: 10px; height: 10px; border-radius: 999px; background: {{ t.dot }}"></span>{{ t.label }}</button>
</sc-for>
</div>
<div style="display: flex; flex-wrap: wrap; gap: 24px">
<article style="flex: 999 1 560px; min-width: 0; background: #FFFFFF; border: 1px solid #E2E6E1; border-radius: 16px; padding: 32px">
<h2 style="margin: 0 0 14px; font-family: 'Space Grotesk', sans-serif; font-size: 24px">{{ topicLevel.heading }}</h2>
<p style="margin: 0; font-size: 17px; white-space: pre-line; color: #22302A">{{ topicLevel.body }}</p>
<div style="margin-top: 28px; padding: 20px 22px; border-radius: 12px; background: #E9F3EE">
<h3 style="margin: 0 0 6px; font-size: 16px; font-weight: 600; color: #0B4D39">Mida see Eestis tähendab</h3>
<p style="margin: 0; font-size: 15px; color: #1D3A2F; white-space: pre-line">{{ topic.estonia }}</p>
</div>
<sc-if value="{{ tx.hasExample }}" hint-placeholder-val="{{ true }}">
<div style="margin-top: 20px; padding: 20px 22px; border-radius: 12px; border: 1px solid #E2E6E1; background: #FBFCFA">
<h3 style="margin: 0 0 6px; font-size: 16px; font-weight: 600">Näide</h3>
<p style="margin: 0; font-size: 15px; color: #22302A; white-space: pre-line">{{ tx.example }}</p>
</div>
</sc-if>
<sc-if value="{{ tx.hasMistakes }}" hint-placeholder-val="{{ true }}">
<div style="margin-top: 20px">
<h3 style="margin: 0 0 8px; font-size: 16px; font-weight: 600">Levinud vead</h3>
<ul style="margin: 0; padding-left: 20px; display: flex; flex-direction: column; gap: 6px; font-size: 15px; color: #22302A">
<sc-for list="{{ tx.mistakes }}" as="m" hint-placeholder-count="3">
<li>{{ m }}</li>
</sc-for>
</ul>
</div>
</sc-if>
<sc-if value="{{ tx.hasQuiz }}" hint-placeholder-val="{{ true }}">
<div style="margin-top: 24px; padding: 20px 22px; border-radius: 12px; background: #F2F4F1">
<p style="margin: 0 0 4px; font-size: 13px; font-weight: 600; color: #0B4D39; text-transform: uppercase; letter-spacing: 0.04em">Kontrolli ennast</p>
<p style="margin: 0 0 12px; font-size: 17px; font-weight: 600">{{ tx.quizQ }}</p>
<div style="display: flex; flex-direction: column; gap: 8px">
<sc-for list="{{ tx.quizOpts }}" as="o" hint-placeholder-count="3">
<button onClick="{{ o.pick }}" style="{{ o.style }}">{{ o.label }}</button>
</sc-for>
</div>
<sc-if value="{{ tx.quizDone }}" hint-placeholder-val="{{ false }}">
<p style="margin: 12px 0 0; font-size: 15px; color: #22302A">{{ tx.quizResult }}</p>
</sc-if>
</div>
</sc-if>
<sc-if value="{{ tx.hasSources }}" hint-placeholder-val="{{ false }}">
<div style="margin-top: 20px; font-size: 14px">
<p style="margin: 0 0 6px; font-weight: 600">Allikad</p>
<ul style="margin: 0; padding-left: 20px; display: flex; flex-direction: column; gap: 4px">
<sc-for list="{{ tx.sources }}" as="src" hint-placeholder-count="1">
<li><a href="{{ src.url }}" target="_blank" rel="noopener">{{ src.label }}</a></li>
</sc-for>
</ul>
</div>
</sc-if>
<div style="margin-top: 28px; padding-top: 18px; border-top: 1px solid #E2E6E1; display: flex; flex-wrap: wrap; justify-content: space-between; gap: 10px">
<sc-if value="{{ tx.hasPrev }}" hint-placeholder-val="{{ true }}">
<button onClick="{{ tx.goPrev }}" style="min-height: 44px; padding: 0 14px; border: 1px solid #C9D1CB; border-radius: 10px; background: #FFFFFF; color: #14201B; font-size: 14px; text-align: left">{{ tx.prevLabel }}</button>
</sc-if>
<sc-if value="{{ tx.hasNext }}" hint-placeholder-val="{{ true }}">
<button onClick="{{ tx.goNext }}" style="margin-left: auto; min-height: 44px; padding: 0 16px; border: 0; border-radius: 10px; background: {{ accent }}; color: #FFFFFF; font-size: 14px; font-weight: 600; text-align: right">{{ tx.nextLabel }}</button>
</sc-if>
</div>
</article>
<aside style="flex: 1 1 260px; display: flex; flex-direction: column; gap: 16px">
<div style="background: #FFFFFF; border: 1px solid #E2E6E1; border-radius: 16px; padding: 22px">
<h3 style="margin: 0 0 12px; font-size: 16px">Seotud mõisted</h3>
<div style="display: flex; flex-wrap: wrap; gap: 8px">
<sc-for list="{{ tx.termChips }}" as="term" hint-placeholder-count="3">
<button onClick="{{ term.pick }}" style="min-height: 36px; padding: 0 12px; border: 1px solid #C9D1CB; border-radius: 999px; background: #FFFFFF; font-size: 14px; color: #2B3A33">{{ term.label }}</button>
</sc-for>
</div>
</div>
<div style="background: #FFFFFF; border: 1px solid #E2E6E1; border-radius: 16px; padding: 22px; display: flex; flex-direction: column; gap: 10px">
<h3 style="margin: 0; font-size: 16px">Jäi midagi segaseks?</h3>
<button onClick="{{ askTopic }}" style="min-height: 44px; border: 0; border-radius: 10px; background: {{ accent }}; color: #FFFFFF; font-size: 15px; font-weight: 600">Küsi abiliselt</button>
<button onClick="{{ goQa }}" style="min-height: 44px; border: 1px solid #C9D1CB; border-radius: 10px; background: #FFFFFF; color: #14201B; font-size: 15px">Küsi kogukonnalt</button>
</div>
</aside>
</div>
</sc-if>

<sc-if value="{{ isGlossary }}" hint-placeholder-val="{{ false }}">
<h1 style="margin: 0 0 8px; font-family: 'Space Grotesk', sans-serif; font-size: 36px">Sõnastik</h1>
<p style="margin: 0 0 20px; color: #4B5A53">{{ glossCount }} mõistet lühidalt ja lihtsalt. Põhjalikum selgitus on teemalehel.</p>
<label for="gq" style="display: block; font-size: 14px; font-weight: 600; margin-bottom: 6px">Otsi mõistet</label>
<input id="gq" value="{{ glossQ }}" onChange="{{ setGlossQ }}" placeholder="nt dividend" style="width: 100%; max-width: 420px; box-sizing: border-box; min-height: 48px; padding: 0 16px; font-size: 16px; border: 1.5px solid #C9D1CB; border-radius: 12px; background: #FFFFFF">
<div role="group" aria-label="Kategooria" style="display: flex; flex-wrap: wrap; gap: 8px; margin-top: 16px">
<sc-for list="{{ glossCatOpts }}" as="c" hint-placeholder-count="7">
<button onClick="{{ c.pick }}" style="{{ c.style }}">{{ c.label }}</button>
</sc-for>
</div>
<dl style="margin: 24px 0 0; display: grid; grid-template-columns: repeat(auto-fill, minmax(300px, 1fr)); gap: 12px">
<sc-for list="{{ glossary }}" as="g" hint-placeholder-count="8">
<div style="background: #FFFFFF; border: 1px solid #E2E6E1; border-radius: 12px; padding: 18px 20px; display: flex; flex-direction: column; gap: 6px">
<dt style="font-family: 'Space Grotesk', sans-serif; font-size: 18px; font-weight: 600">{{ g.term }}</dt>
<dd style="margin: 0; font-size: 15px; color: #3A4943; flex: 1">{{ g.def }}</dd>
<dd style="margin: 4px 0 0; display: flex; flex-wrap: wrap; justify-content: space-between; align-items: center; gap: 8px">
<span style="font-size: 12px; color: #4B5A53">{{ g.cat }}</span>
<sc-if value="{{ g.hasTopic }}" hint-placeholder-val="{{ true }}">
<button onClick="{{ g.open }}" style="min-height: 36px; padding: 0 10px; border: 0; background: none; color: #0B5C43; font-size: 14px; font-weight: 600">Loe teemat →</button>
</sc-if>
</dd>
</div>
</sc-for>
</dl>
<sc-if value="{{ glossEmpty }}" hint-placeholder-val="{{ false }}">
<p style="margin: 20px 0 0; color: #4B5A53">Sellist mõistet sõnastikus veel pole. Küsi abiliselt.</p>
</sc-if>
</sc-if>

<sc-if value="{{ isQa }}" hint-placeholder-val="{{ false }}">
<h1 style="margin: 0 0 8px; font-family: 'Space Grotesk', sans-serif; font-size: 36px">Küsimused ja vastused</h1>
<p style="margin: 0 0 24px; color: #4B5A53">Algajate küsimustele vastavad kogenumad investorid. Prototüübis on näidisküsimused.</p>
<div style="display: flex; flex-wrap: wrap; gap: 24px">
<section style="flex: 999 1 560px; min-width: 0; display: flex; flex-direction: column; gap: 12px">
<sc-for list="{{ questions }}" as="q" hint-placeholder-count="4">
<article style="background: #FFFFFF; border: 1px solid #E2E6E1; border-radius: 14px; padding: 20px 22px">
<div style="display: flex; flex-wrap: wrap; align-items: center; gap: 8px; margin-bottom: 8px">
<span style="display: inline-flex; align-items: center; gap: 6px; font-size: 13px; font-weight: 600; color: #2B3A33"><span style="width: 9px; height: 9px; border-radius: 999px; background: {{ q.dot }}"></span>{{ q.level }}</span>
<span style="font-size: 13px; color: #4B5A53">· {{ q.tag }}</span>
</div>
<button onClick="{{ q.toggle }}" style="background: none; border: 0; padding: 0; text-align: left; font-family: 'Space Grotesk', sans-serif; font-size: 19px; font-weight: 600; color: #14201B; min-height: 32px">{{ q.title }}</button>
<sc-if value="{{ q.open }}" hint-placeholder-val="{{ false }}">
<div style="margin-top: 12px; padding: 16px 18px; border-left: 0; border-radius: 10px; background: #F2F5F1">
<p style="margin: 0 0 6px; font-size: 13px; font-weight: 600; color: {{ accent }}">{{ q.answerLabel }}</p>
<p style="margin: 0; font-size: 15px; color: #22302A; white-space: pre-line">{{ q.answer }}</p>
<sc-if value="{{ q.waiting }}" hint-placeholder-val="{{ false }}">
<p style="margin: 10px 0 0; font-size: 14px; color: #5C3B00">Ootab kogukonna vastust. Kogenud liikmed saavad AI vastust täiendada või parandada.</p>
</sc-if>
</div>
<sc-for list="{{ q.replies }}" as="rep" hint-placeholder-count="0">
<div style="{{ rep.style }}">
<div style="display: flex; flex-wrap: wrap; justify-content: space-between; align-items: center; gap: 8px; margin-bottom: 6px">
<span style="font-size: 13px; font-weight: 600; color: #2B3A33">{{ rep.label }}</span>
<sc-if value="{{ rep.isBest }}" hint-placeholder-val="{{ false }}">
<span style="font-size: 12px; font-weight: 600; padding: 3px 10px; border-radius: 999px; background: #0E6B4F; color: #FFFFFF">Parim vastus</span>
</sc-if>
</div>
<p style="margin: 0; font-size: 15px; color: #22302A; white-space: pre-line">{{ rep.text }}</p>
<sc-if value="{{ rep.canMark }}" hint-placeholder-val="{{ false }}">
<button onClick="{{ rep.markBest }}" style="margin-top: 10px; min-height: 36px; padding: 0 12px; border: 1px solid #0E6B4F; border-radius: 8px; background: #FFFFFF; color: #0B5C43; font-size: 13px; font-weight: 600">Märgi parimaks vastuseks</button>
</sc-if>
</div>
</sc-for>
<div style="margin-top: 14px; display: flex; flex-direction: column; gap: 8px">
<label for="{{ q.nameId }}" style="font-size: 14px; font-weight: 600">Sinu nimi <span style="font-weight: 400; color: #4B5A53">(valikuline, tühjaks jättes oled anonüümne)</span></label>
<input id="{{ q.nameId }}" value="{{ myName }}" onChange="{{ setMyName }}" placeholder="nt Mari" style="max-width: 320px; min-height: 44px; padding: 0 12px; font-size: 15px; border: 1.5px solid #C9D1CB; border-radius: 10px">
<label for="{{ q.replyId }}" style="font-size: 14px; font-weight: 600">Sinu vastus</label>

          if (amt < 1) { self.setState({ pfLog: ['Vaba raha on otsas. Müü midagi või alusta otsast.'].concat(s.pfLog).slice(0, 6) }); return; }
          var u = Object.assign({}, s.pfUnits); u[a.id] = (u[a.id] || 0) + amt / s.pfPrices[a.id];
          self.setState({ pfCash: s.pfCash - amt, pfUnits: u, pfLog: ['Ostsid ' + Math.round(amt) + ' € eest: ' + a.name].concat(s.pfLog).slice(0, 6) });
        },
        sell: function () {
          if (!has) return;
          var val = units * s.pfPrices[a.id];
          var u = Object.assign({}, s.pfUnits); delete u[a.id];
          self.setState({ pfCash: s.pfCash + val, pfUnits: u, pfLog: ['Müüsid ' + Math.round(val) + ' € eest: ' + a.name].concat(s.pfLog).slice(0, 6) });
        }
      };
    });
    var pf = {
      totalLabel: this.fmt(pfTotal), cashLabel: this.fmt(s.pfCash),
      changeLabel: fmtP(change),
      changeStyle: 'margin: 4px 0 0; font-family: \'Space Grotesk\', sans-serif; font-size: 26px; font-weight: 600; color: ' + (change >= 0 ? '#0B5C43' : '#A3302A'),
      monthLabel: s.pfMonth === 0 ? 'Algus' : (s.pfMonth >= 12 ? Math.floor(s.pfMonth / 12) + ' a ' + (s.pfMonth % 12) + ' k' : s.pfMonth + (s.pfMonth === 1 ? ' kuu' : ' kuud')),
      bars: bars, chartLabel: 'Portfelli väärtus: ' + Math.round(pfTotal) + ' €, muutus ' + fmtP(change),
      rows: rows, amtOpts: amtOpts, log: s.pfLog, lesson: lesson,
      hasLessonLink: !!lessonLink, lessonLinkLabel: lessonLink ? 'Loe: ' + lessonLink[0] : '',
      lessonOpen: function () { if (lessonLink) self.go('topic', { topicId: lessonLink[1] }); }
    };

    var r = s.rate / 100 / 12;
    var n = s.years * 12;
    var total = r === 0 ? s.monthly * n : s.monthly * (Math.pow(1 + r, n) - 1) / r;
    var deposits = s.monthly * n;

    var low = (s.asked || '').toLowerCase();
    var answer;
    var kw = [['etf', 'etf'], ['fond', 'etf'], ['investeerimiskonto', 'ik'], ['konto', 'ik'], ['pension', 'sammas'], ['samba', 'sammas'], ['sammas', 'sammas'], ['dividend', 'dividendid'], ['võlakir', 'volakiri'], ['aktsia', 'aktsia'], ['hajut', 'hajutamine'], ['risk', 'risk'], ['puhver', 'risk'], ['alust', 'alustamine'], ['esimene', 'alustamine'], ['tasu', 'tasud'], ['maks', 'ik']];
    var hit = null;
    kw.forEach(function (k) { if (!hit && low.indexOf(k[0]) >= 0) hit = k[1]; });
    if (low.indexOf('mida osta') >= 0 || low.indexOf('soovita') >= 0 || low.indexOf('kas osta') >= 0) {
      answer = { text: 'Ma ei saa öelda, mida konkreetselt osta, sest see oleks investeerimisnõustamine. Küll aga saan selgitada, mille järgi valikuid võrrelda: risk, tasud, ajahorisont ja hajutatus.', hasLink: true, linkLabel: 'Loe: Esimene investeering', open: function () { self.go('topic', { topicId: 'alustamine' }); } };
    } else if (hit && topics[hit]) {
      var tp = topics[hit];
      answer = { text: tp.lead + '\n\n' + tp.levels.algaja.body, hasLink: true, linkLabel: 'Loe edasi: ' + tp.title, open: function () { self.go('topic', { topicId: hit, level: 'algaja' }); } };
    } else {
      answer = { text: 'Sellele küsimusele ei leidnud ma saidi sisust kindlat vastust ega taha arvata. Vaata teemasid või küsi kogukonnalt, sealt saad vastuse päris inimestelt.', hasLink: true, linkLabel: 'Vaata kõiki teemasid', open: function () { self.go('topics'); } };
    }

    return {
      accent: accent,
      nav: nav,
      isHome: s.screen === 'home', isTopics: s.screen === 'topics', isTopic: s.screen === 'topic',
      isGlossary: s.screen === 'glossary', isQa: s.screen === 'qa', isCalc: s.screen === 'calc', isAi: s.screen === 'ai', isFees: s.screen === 'fees', isPf: s.screen === 'pf',
      goPf: function () { self.go('pf'); },
      pf: pf,
      pfNext: function () { self.pfStep(s, 1); },
      pfYear: function () { self.pfStep(s, 12); },
      pfReset: function () { self.setState(self.pfStart()); },
      myName: s.myName || '',
      setMyName: function (e) { self.setState({ myName: e.target.value }); },
      newQ: s.newQ || '', newLevel: s.newLevel || 'Algaja',
      setNewQ: function (e) { self.setState({ newQ: e.target.value }); },
      setNewLevel: function (e) { self.setState({ newLevel: e.target.value }); },
      postQ: function () {
        var t = (s.newQ || '').trim();
        if (!t) return;
        var lvl = s.newLevel || 'Algaja';
        var dots = { 'Algaja': '#1F8A5B', 'Kesktase': '#C27A00', 'Edasijõudnu': '#B4382F' };
        var id = 'u' + Date.now();
        var nq = { id: id, asker: (s.myName || '').trim(), level: lvl, dot: dots[lvl], tag: 'Uus küsimus', title: t, answer: 'Küsimus on postitatud. Kogukonna vastused ilmuvad siia.', answerLabel: 'Staatus', waiting: true };
        self.setState({ userQs: [nq].concat(s.userQs), openQ: id, newQ: '' });
      },
      fbNone: s.fb === 'none', fbThanks: s.fb === 'yes',
      fbYes: function () { self.setState({ fb: 'yes' }); },
      toForum: function () {
        var id = 'u' + Date.now();
        var nq = { id: id, asker: (s.myName || '').trim(), level: 'Algaja', dot: '#1F8A5B', tag: 'Uus küsimus', title: s.asked, answer: answer.text, answerLabel: 'AI-abilise esimene vastus', waiting: true };
        self.go('qa', { userQs: [nq].concat(s.userQs), openQ: id, fb: 'none' });
      },
      goFees: function () { self.go('fees'); },
      feeRows: feeRows, tradeOpts: tradeOpts, assetOpts: assetOpts,
      feeMonthly: s.feeMonthly,
      setFeeMonthly: function (e) { self.setState({ feeMonthly: Number(e.target.value) }); },
      feeMonthlyLabel: this.fmt(s.feeMonthly),
      feeYearLabel: this.fmt(yearDeposits),
      perTradeLabel: this.fmt(perTradeAmt),
      minNote: feeAsset === 'balti'
        ? 'Balti aktsiad on pankades tasuta, seepärast mõjutab tulemust peamiselt tehingute arv.'
        : (perTradeAmt < 2786
          ? 'Pankades maksad praegu miinimumtasu: kuni umbes 2 786 € tehinguni (Swedbank) ja 3 571 € tehinguni (LHV, SEB) on tasu iga tehingu kohta sama. Mida väiksem tehing, seda suurem osa sinu rahast tasuks läheb.'
          : (perTradeAmt < 3571
            ? 'Swedbankis kehtib nüüd juba 0,14 %, LHV-s ja SEB-s veel miinimumtasu 5 €.'
            : 'Kõigis pankades kehtib nüüd protsenditasu 0,14 %, seega kasvab eurosumma koos tehingu suurusega.')),
      goHome: function () { self.go('home'); },
      goTopics: function () { self.go('topics'); },
      goGlossary: function () { self.go('glossary'); },
      goQa: function () { self.go('qa'); },
      goCalc: function () { self.go('calc'); },
      homeQ: s.homeQ,
      setHomeQ: function (e) { self.setState({ homeQ: e.target.value }); },
      homeKey: function (e) { if (e.key === 'Enter') self.ask(s.homeQ); },
      askHome: function () { self.ask(s.homeQ); },
      chips: chips, doors: doors, steps: steps,
      levelTabs: levelTabs, topicCards: topicCards,
      topic: topic, topicLevel: topicLevel, tx: topicExtra,
      askTopic: function () { self.ask(topic.title); },
      glossQ: s.glossQ, glossary: glossary, glossCatOpts: glossCatOpts, glossCount: glossAll.length, glossEmpty: glossary.length === 0,
      setGlossQ: function (e) { self.setState({ glossQ: e.target.value }); },
      questions: questions,
      monthly: s.monthly, years: s.years, rate: s.rate,
      setMonthly: function (e) { self.setState({ monthly: Number(e.target.value) }); },
      setYears: function (e) { self.setState({ years: Number(e.target.value) }); },
      setRate: function (e) { self.setState({ rate: Number(e.target.value) }); },
      monthlyLabel: this.fmt(s.monthly),
      yearsLabel: s.years + (s.years === 1 ? ' aasta' : ' aastat'),
      rateLabel: String(s.rate).replace('.', ',') + ' %',
      totalLabel: this.fmt(total), depositsLabel: this.fmt(deposits), gainLabel: this.fmt(total - deposits),
      asked: s.asked, answer: answer,
      aiQ: s.aiQ,
      setAiQ: function (e) { self.setState({ aiQ: e.target.value }); },
      aiKey: function (e) { if (e.key === 'Enter') self.ask(s.aiQ); },
      askAi: function () { self.ask(s.aiQ); }
    };
  }
}

(function () {
  var KEY = 'borsitark-v1';
  var KEEP = ["pfCash", "pfUnits", "pfPrices", "pfMoves", "pfMonth", "pfHist", "pfAmt", "pfLog", "userQs", "replies", "votes", "best", "quiz", "myName", "level"];
  window.addEventListener('DOMContentLoaded', function () {
    mountDC(Component, document.getElementById('app'), document.getElementById('tpl'), {
      load: function () { var raw = localStorage.getItem(KEY); return raw ? JSON.parse(raw) : {}; },
      save: function (st) { var o = {}; KEEP.forEach(function (k) { if (st[k] !== undefined) o[k] = st[k]; }); localStorage.setItem(KEY, JSON.stringify(o)); }
    });
  });
})();

</script>
</body>
